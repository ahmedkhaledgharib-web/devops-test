name: Docker Build & Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    name: Build & Push Production Image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=prod-{{date 'YYYYMMDD-HHmmss'}}

      - name: Build and push production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write image summary
        if: always()
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_PLATFORMS: ${{ env.PLATFORMS }}
          IMAGE_OUTCOME: ${{ steps.build.outcome }}
        run: |
          {
            echo "## 🐳 Docker Build & Push"
            echo
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Result | \`${IMAGE_OUTCOME:-unknown}\` |"
            echo "| Image | \`${IMAGE_REF}\` |"
            echo "| Digest | \`${IMAGE_DIGEST:-n/a}\` |"
            echo "| Platforms | \`${IMAGE_PLATFORMS}\` |"
            echo
            echo "### Tags"
            echo
            echo "| Tag |"
            echo "| --- |"
            if [ -z "${IMAGE_TAGS}" ]; then
              echo "| _No tags were produced_ |"
            else
              echo "${IMAGE_TAGS}" | tr ',' '\n' | while IFS= read -r tag; do
                [ -n "$tag" ] && echo "| \`$tag\` |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
