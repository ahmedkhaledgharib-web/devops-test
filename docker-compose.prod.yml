name: devops-test-prod

services:
  # Applies pending migrations to the Neon Cloud database, then exits.
  # Remove this service if migrations are run by your CI/CD pipeline instead.
  migrate:
    build:
      context: .
      target: development
    command: ["node", "scripts/db-migrate.js"]
    env_file:
      - .env.production
    restart: "no"

  app:
    build:
      context: .
      target: production
    image: ${APP_IMAGE:-devops-test:prod}
    env_file:
      - .env.production
    environment:
      # Production never talks to a local proxy. DATABASE_URL is the Neon Cloud
      # serverless connection string injected from .env.production / CI secrets.
      NODE_ENV: production
      NEON_LOCAL: "false"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - app-logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app-logs:
